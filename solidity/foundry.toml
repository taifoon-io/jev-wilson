# WilsonPremium: wilson-premium-v1 in Solidity, tested on the same vector file as the TypeScript and Python.
#   forge test                                   golden vectors + fuzz (no dependencies to install)
#   WILSON_FFI=1 forge test --ffi                also fuzz against the TypeScript through node (needs node >= 22.6)
[profile.default]
src            = "src"
out            = "out"
test           = "test"
libs           = []
solc           = "0.8.24"
evm_version    = "cancun"
optimizer      = true
optimizer_runs = 200
# the vectors live beside the TypeScript and Python tests: one file, three languages
fs_permissions = [{ access = "read", path = "../tests" }]
# the golden grid is ~45k rows in one test
gas_limit      = "18446744073709551615"
memory_limit   = 4294967296

[fuzz]
runs = 10000
seed = "0x7769_6c73_6f6e"
