# Publishes taifoon-jev-wilson to PyPI through a trusted publisher (OIDC, no token) when a v* tag is pushed.
# One-time, on pypi.org: add a (pending) trusted publisher for project taifoon-jev-wilson,
# owner taifoon-io, repository jev-wilson, workflow publish-pypi.yml, environment pypi.
name: publish-pypi
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install build pytest 'typesafe-sdk>=0.7.2'
      - run: pytest tests -q
      - name: The tag must match pyproject.toml
        run: test "v$(python -c "import tomllib;print(tomllib.load(open('python/pyproject.toml','rb'))['project']['version'])")" = "${GITHUB_REF_NAME}"
      - run: python -m build python --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/taifoon-jev-wilson
    permissions:
      id-token: write      # the trusted-publisher exchange
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
