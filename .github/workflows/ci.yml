name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm pack --dry-run
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest
      - name: TypeSafe AI's SDK for the grade() test (it needs Python 3.10+)
        if: matrix.python != '3.9'
        run: pip install 'typesafe-sdk>=0.7.2'
      - run: pytest tests -q -rs
  solidity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: forge test (golden grid + fuzz)
        working-directory: solidity
        run: forge test
      - name: FFI parity with the TypeScript
        working-directory: solidity
        run: WILSON_FFI=1 forge test --ffi --match-test ffi
